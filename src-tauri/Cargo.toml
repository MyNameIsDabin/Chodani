[package]
name = "chodani"
version = "0.1.2"
description = "Frame-accurate reference video player for animation & VFX"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chodani_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "2"
urlencoding = "2"
dirs = "5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
